name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-slim.
          node-version: 22
          cache: npm

      # Installs both workspaces (client + server) from the lockfile.
      - run: npm ci

      - run: npm run lint

      # Type-checks the server's tests too (the production build in
      # `npm run build` / Docker excludes *.test.ts).
      - run: npm run typecheck -w server

      - run: npm test

      - run: npm run build
