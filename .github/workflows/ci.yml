name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Dockerfile's node:22-slim.
          node-version: 22
          cache: npm

      # Installs both workspaces (client + server) from the lockfile.
      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
