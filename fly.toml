# fly.toml app configuration file generated for dispatch-desk on 2026-09-05T07:37:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'dispatch-desk'
primary_region = 'ams'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
